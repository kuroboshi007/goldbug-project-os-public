name: Commit checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-metadata:
    name: Commit metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_OS_CI: '1'
          PROJECT_OS_COMMIT_EMAIL: ${{ vars.PROJECT_OS_COMMIT_EMAIL }}
        run: bash scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
